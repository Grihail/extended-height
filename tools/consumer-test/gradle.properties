# Minimal consumer of ExtendedHeight (plan step 2): checks that the library, used as a normal dependency, works in the
# dev environment and in the obfuscated environment of ANOTHER project. Not part of the library build.
modName = EH Consumer Test
modVersion = 1.0.0
gtnh.modules.gitVersion = false
modId = ehconsumer
modGroup = io.github.ehconsumer
useModGroupForPublishing = true
autoUpdateBuildScript = false
minecraftVersion = 1.7.10
forgeVersion = 10.13.4.1614
channel = stable
mappingsVersion = 12
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/
developmentEnvironmentUserName = Developer
enableModernJavaSyntax = false
generateGradleTokenClass =
apiPackage =
accessTransformersFile =
# The consumer has no mixins of its own; UniMixins comes in as a dependency of the library.
usesMixins = false
forceEnableMixins = true
containsMixinsAndOrCoreModOnly = false
usesShadowedDependencies = false
includeWellKnownRepositories = true
usesMavenPublishing = false
gtnh.settings.blowdryerTag = 0.2.2
org.gradle.configuration-cache = true
